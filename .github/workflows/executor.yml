# Buffer's executor heartbeat. Works on any Vercel plan (Vercel Hobby crons run only once a day).
# Set two repository secrets: BUFFER_URL (e.g. https://buffer.vercel.app) and CRON_SECRET (same value as on Vercel).
name: executor
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run Buffer executor
        env:
          BUFFER_URL: ${{ secrets.BUFFER_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BUFFER_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Set BUFFER_URL and CRON_SECRET secrets"; exit 0; fi
          curl -fsS --max-time 280 -H "Authorization: Bearer $CRON_SECRET" "$BUFFER_URL/api/cron/tick"
